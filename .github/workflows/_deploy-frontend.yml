# Store ICU - Frontend Deploy (Reusable)
# Called by deploy-frontend.yml. Builds Vite app and deploys to Firebase Hosting.
#
# Required GitHub Actions variables (set per environment):
#   GCP_PROJECT_ID            – GCP project ID
#   WORKLOAD_IDENTITY_PROVIDER – Full WIF provider path from terraform output
#   DEPLOY_SERVICE_ACCOUNT    – Deploy SA email from terraform output
#   FIREBASE_HOSTING_SITE     – Firebase Hosting site ID (aha-coms-sicu-dev / aha-coms-sicu-prod)
#   VITE_FIREBASE_API_KEY     – Firebase Web API key
#   VITE_FIREBASE_AUTH_DOMAIN – Firebase Auth domain
#   VITE_FIREBASE_PROJECT_ID  – Firebase project ID
#   VITE_API_BASE_URL         – Backend API URL (Cloud Run)

name: _Deploy Frontend

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - name: Configure Firebase deploy target
        run: firebase target:apply hosting ${{ vars.FIREBASE_HOSTING_SITE }} ${{ vars.FIREBASE_HOSTING_SITE }} --project ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting:${{ vars.FIREBASE_HOSTING_SITE }} --project ${{ vars.GCP_PROJECT_ID }}

      - name: Verify deployment
        run: |
          URL="https://${{ vars.FIREBASE_HOSTING_SITE }}.web.app"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" --max-time 30 || true)
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Health check passed (HTTP $STATUS) at $URL"
          else
            echo "::error::Health check failed (HTTP $STATUS) at $URL"
            exit 1
          fi
