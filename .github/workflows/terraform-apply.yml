name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment approval context for the apply"
        required: true
        type: choice
        options:
          - dev
          - production
  push:
    branches: [develop, production]
    paths:
      - '.github/workflows/terraform-*.yml'
      - 'infrastructure/terraform/**'

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: >-
      ${{
        github.event_name == 'workflow_dispatch'
          && inputs.environment
          || (github.ref == 'refs/heads/production' && 'production' || 'dev')
      }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure/terraform
    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -upgrade -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan \
            -input=false \
            -out=tfplan \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${{ vars.GCP_REGION }}" \
            -var="github_repo=${{ github.repository }}" \
            -var="firebase_project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="email_from_email=noreply@ahabot.ai" \
            -var="sendgrid_api_key=placeholder-sendgrid-key"

      - name: Terraform apply
        run: terraform apply -input=false tfplan

      - name: Summarize apply
        run: |
          {
            echo "## Terraform apply"
            echo ""
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Approval environment: \`${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/production' && 'production' || 'dev') }}\`"
            echo "- Contract: applies run only from protected branches or manual dispatch."
          } >> "$GITHUB_STEP_SUMMARY"
