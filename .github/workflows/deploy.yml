# Store ICU - Deploy Workflow
# Single orchestrator: runs CI once, then deploys backend + frontend in parallel.
# Dev: auto-deploys on push to develop.  Prod: requires environment protection approval.

name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [develop, production]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name == 'develop' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy-backend:
    needs: ci
    uses: ./.github/workflows/_deploy-backend.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ github.ref == 'refs/heads/production' && 'production' || 'dev' }}

  deploy-frontend:
    needs: ci
    uses: ./.github/workflows/_deploy-frontend.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ github.ref == 'refs/heads/production' && 'production' || 'dev' }}
