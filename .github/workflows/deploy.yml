# Store ICU - Deploy Workflow
# Single orchestrator: runs CI once, then deploys dev backend + frontend in parallel.
# Backend production promotion reuses verified develop artifacts via
# promote-backend.yml, so production never rebuilds backend images inside the
# deploy path. The intended release model is that the production branch is
# fast-forwarded to the exact develop release commit before any production
# deployment is triggered. Skips entirely for docs-only changes.

name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [develop, production]
    paths-ignore:
      - '*.md'
      - 'my-designs/**'
      - 'docs/**'
      - '.claude/**'
      - '.gitnexus/**'
      - 'lefthook.yml'

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name == 'develop' }}

jobs:
  # Detect which parts of the codebase changed so we can skip unnecessary deploys.
  # NOTE: On production branch, paths-filter compares develop...production which
  # shows 0 changes after a merge. The deploy jobs handle this via the
  # "always deploy on production" condition.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'frontend/src/locales/**'
            frontend:
              - 'frontend/**'

  ci:
    needs: changes
    uses: ./.github/workflows/ci.yml

  build-backend-image:
    needs: [ci, changes]
    if: >-
      github.ref == 'refs/heads/develop'
      && (needs.changes.outputs.backend == 'true'
      || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/_build-backend-image.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev

  deploy-backend:
    needs: [ci, changes, build-backend-image]
    if: >-
      github.ref == 'refs/heads/develop'
      && (needs.changes.outputs.backend == 'true'
      || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/_deploy-backend.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
      image: ${{ needs.build-backend-image.outputs.image }}

  deploy-frontend:
    needs: [ci, changes]
    if: >-
      needs.changes.outputs.frontend == 'true'
      || github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/production'
    uses: ./.github/workflows/_deploy-frontend.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ github.ref == 'refs/heads/production' && 'production' || 'dev' }}

  promote-backend-production:
    needs: [ci, changes]
    if: >-
      github.ref == 'refs/heads/production'
      && (needs.changes.outputs.backend == 'true'
      || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/promote-backend.yml
    permissions:
      contents: read
      actions: read
      id-token: write
