# Store ICU - Backend Deploy (Reusable)
# Deploys an existing backend image to Cloud Run. Wakes Cloud SQL if stopped,
# runs migrations from that same image, then verifies the release.
#
# Required GitHub Actions variables (set per environment):
#   GCP_PROJECT_ID            – GCP project ID
#   GCP_REGION                – GCP region (asia-southeast2)
#   WORKLOAD_IDENTITY_PROVIDER – Full WIF provider path from terraform output
#   DEPLOY_SERVICE_ACCOUNT    – Deploy SA email from terraform output
#   CLOUD_RUN_SERVICE         – Cloud Run service name (aha-coms-sicu-dev-api / aha-coms-sicu-prod-api)
#   CLOUD_SQL_INSTANCE_CONNECTION – Cloud SQL instance connection name (project:region:instance)
#   CLOUD_SQL_INSTANCE_NAME   – Cloud SQL instance name (for backups and start/stop API)
#   DB_USER                   – Database username
#   DB_NAME                   – Database name
#
# Google Sheets env vars (set per environment, synced to Cloud Run):
#   GSHEETS_VP_SPREADSHEET_ID      – VP sheet spreadsheet ID (Indonesia)
#   GSHEETS_VP_SPREADSHEET_ID_TH   – VP sheet spreadsheet ID (Thailand)
#   GSHEETS_MEETING_SPREADSHEET_ID – 1st Meeting sheet spreadsheet ID
#   GSHEETS_EVAL_SPREADSHEET_ID    – Evaluation status sheet spreadsheet ID
#
#   These are NOT read from tfvars (those files are gitignored).
#   Set them in GitHub Settings > Environments > dev/prod > Variables.
#   Values must match the corresponding entries in each environment's .tfvars.

name: _Deploy Backend

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image:
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      CLOUD_SQL_PROXY_VERSION: "2.14.3"

    steps:
      - uses: actions/checkout@v6

      - name: Derive Secret Manager names
        id: secret-names
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            SUFFIX=prod
          else
            SUFFIX=dev
          fi
          echo "db_secret=aha_coms_sicu_${SUFFIX}_db_password" >> "$GITHUB_OUTPUT"
          echo "sendgrid_secret=aha_coms_sicu_${SUFFIX}_sendgrid_api_key" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - name: Validate deploy preflight
        run: |
          REQUIRED_SECRETS=("${{ steps.secret-names.outputs.db_secret }}" "${{ steps.secret-names.outputs.sendgrid_secret }}")
          for SECRET in "${REQUIRED_SECRETS[@]}"; do
            COUNT=$(gcloud secrets versions list "$SECRET" \
              --project=${{ vars.GCP_PROJECT_ID }} \
              --filter="state=ENABLED" \
              --format="value(name)" --limit=1 | wc -l | tr -d ' ')
            if [ "$COUNT" -eq 0 ]; then
              echo "::error::Secret '$SECRET' has no enabled versions. Backend promotion must stop before rollout."
              exit 1
            fi
            echo "✓ $SECRET has enabled version(s)"
          done

          DB_PASSWORD=$(gcloud secrets versions access latest \
            --secret=${{ steps.secret-names.outputs.db_secret }} \
            --project=${{ vars.GCP_PROJECT_ID }} | tr -d '\r')
          echo "::add-mask::$DB_PASSWORD"
          if [ -z "$(printf "%s" "$DB_PASSWORD" | tr -d '[:space:]')" ]; then
            echo "::error::Database secret '${{ steps.secret-names.outputs.db_secret }}' is empty"
            exit 1
          fi
          case "$(printf "%s" "$DB_PASSWORD" | tr '[:upper:]' '[:lower:]')" in
            placeholder|changeme|change-me|replace-me|replace_me|your-secret-here|todo)
              echo "::error::Database secret '${{ steps.secret-names.outputs.db_secret }}' still looks like a placeholder"
              exit 1
              ;;
          esac

      - name: Ensure Cloud SQL is running
        run: |
          STATE=$(gcloud sql instances describe ${{ vars.CLOUD_SQL_INSTANCE_NAME }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --format="value(state)")
          echo "Cloud SQL state: $STATE"
          if [ "$STATE" != "RUNNABLE" ]; then
            echo "Starting Cloud SQL instance..."
            gcloud sql instances patch ${{ vars.CLOUD_SQL_INSTANCE_NAME }} \
              --project=${{ vars.GCP_PROJECT_ID }} \
              --activation-policy=ALWAYS --quiet
            echo "Waiting for instance to become RUNNABLE..."
            for i in $(seq 1 30); do
              STATE=$(gcloud sql instances describe ${{ vars.CLOUD_SQL_INSTANCE_NAME }} \
                --project=${{ vars.GCP_PROJECT_ID }} \
                --format="value(state)")
              if [ "$STATE" = "RUNNABLE" ]; then
                echo "Cloud SQL is now RUNNABLE"
                break
              fi
              echo "  Attempt $i/30: state=$STATE, waiting 10s..."
              sleep 10
            done
            if [ "$STATE" != "RUNNABLE" ]; then
              echo "::error::Cloud SQL failed to start after 5 minutes"
              exit 1
            fi
          fi

      - name: Create pre-migration backup (prod only)
        if: inputs.environment == 'production'
        run: |
          BACKUP_DESC="pre-deploy-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}"
          echo "Creating backup: $BACKUP_DESC"
          gcloud sql backups create \
            --instance=${{ vars.CLOUD_SQL_INSTANCE_NAME }} \
            --description="$BACKUP_DESC" \
            --project=${{ vars.GCP_PROJECT_ID }}
          echo "Backup created successfully"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Pull deploy image
        run: docker pull "${{ inputs.image }}"

      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -sSf -o cloud-sql-proxy \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v${CLOUD_SQL_PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy ${{ vars.CLOUD_SQL_INSTANCE_CONNECTION }} --port 5432 &
          sleep 3

      - name: Run database migrations
        run: |
          export DB_PASSWORD=$(gcloud secrets versions access latest \
            --secret=${{ steps.secret-names.outputs.db_secret }} --project=${{ vars.GCP_PROJECT_ID }})
          export DATABASE_URL="postgresql://${{ vars.DB_USER }}:${DB_PASSWORD}@127.0.0.1:5432/${{ vars.DB_NAME }}"
          docker run --rm --network host \
            -e DATABASE_URL \
            --entrypoint uv \
            "${{ inputs.image }}" \
            run alembic -c app/db/migrations/alembic.ini upgrade head

      - name: Stop Cloud SQL Auth Proxy
        if: always()
        run: kill $(pgrep -f cloud-sql-proxy) || true

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ inputs.image }}
          env_vars: |
            GSHEETS_VP_SPREADSHEET_ID=${{ vars.GSHEETS_VP_SPREADSHEET_ID }}
            GSHEETS_VP_SPREADSHEET_ID_TH=${{ vars.GSHEETS_VP_SPREADSHEET_ID_TH }}
            GSHEETS_MEETING_SPREADSHEET_ID=${{ vars.GSHEETS_MEETING_SPREADSHEET_ID }}
            GSHEETS_EVAL_SPREADSHEET_ID=${{ vars.GSHEETS_EVAL_SPREADSHEET_ID }}
          flags: ${{ inputs.environment == 'dev' && '--cpu-throttling' || '' }}

      - name: Route traffic to deployed revision
        id: rollout
        run: |
          DEPLOYED_REVISION=$(gcloud run services describe ${{ vars.CLOUD_RUN_SERVICE }} \
            --region=${{ vars.GCP_REGION }} \
            --format="value(status.latestCreatedRevisionName)")
          if [ -z "$DEPLOYED_REVISION" ]; then
            echo "::error::Cloud Run did not report latestCreatedRevisionName"
            exit 1
          fi

          echo "Routing 100% traffic to deployed revision: $DEPLOYED_REVISION"
          gcloud run services update-traffic ${{ vars.CLOUD_RUN_SERVICE }} \
            --region=${{ vars.GCP_REGION }} \
            --to-revisions="$DEPLOYED_REVISION=100"

          READY_REVISION=$(gcloud run services describe ${{ vars.CLOUD_RUN_SERVICE }} \
            --region=${{ vars.GCP_REGION }} \
            --format="value(status.latestReadyRevisionName)")
          TRAFFIC_REVISION=$(gcloud run services describe ${{ vars.CLOUD_RUN_SERVICE }} \
            --region=${{ vars.GCP_REGION }} \
            --format="value(status.traffic[0].revisionName)")
          TRAFFIC_PERCENT=$(gcloud run services describe ${{ vars.CLOUD_RUN_SERVICE }} \
            --region=${{ vars.GCP_REGION }} \
            --format="value(status.traffic[0].percent)")

          echo "ready_revision=$READY_REVISION"
          echo "traffic_revision=$TRAFFIC_REVISION"
          echo "traffic_percent=$TRAFFIC_PERCENT"

          if [ "$READY_REVISION" != "$DEPLOYED_REVISION" ]; then
            echo "::error::Deployed revision is not ready. deployed=$DEPLOYED_REVISION ready=$READY_REVISION"
            exit 1
          fi
          if [ "$TRAFFIC_REVISION" != "$DEPLOYED_REVISION" ] || [ "$TRAFFIC_PERCENT" != "100" ]; then
            echo "::error::Traffic is not routed to the deployed revision. deployed=$DEPLOYED_REVISION traffic=$TRAFFIC_REVISION percent=$TRAFFIC_PERCENT"
            exit 1
          fi

          echo "deployed_revision=$DEPLOYED_REVISION" >> "$GITHUB_OUTPUT"

      - name: Verify deployment
        run: |
          HEALTH_URL="${{ steps.deploy.outputs.url }}/health"
          RESPONSE=$(curl -s --max-time 30 "$HEALTH_URL" || true)
          STATUS=$(echo "$RESPONSE" | jq -r '.status // empty')
          TRAFFIC_REVISION=$(gcloud run services describe ${{ vars.CLOUD_RUN_SERVICE }} \
            --region=${{ vars.GCP_REGION }} \
            --format="value(status.traffic[0].revisionName)")

          if [ "$TRAFFIC_REVISION" != "${{ steps.rollout.outputs.deployed_revision }}" ]; then
            echo "::error::Service URL traffic moved before verification. expected=${{ steps.rollout.outputs.deployed_revision }} actual=$TRAFFIC_REVISION"
            exit 1
          fi

          if [ "$STATUS" = "healthy" ]; then
            echo "Health check passed at $HEALTH_URL on revision $TRAFFIC_REVISION"
          else
            echo "::error::Health check failed at $HEALTH_URL"
            echo "$RESPONSE"
            exit 1
          fi

      - name: Setup Node.js for smoke tests
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: smoke-tests/package-lock.json

      - name: Run selected smoke tests
        run: |
          cd smoke-tests
          npm ci
          SMOKE_BACKEND_URL="${{ steps.deploy.outputs.url }}" npm run test:ci

      - name: Record verified backend release manifest
        if: success() && inputs.environment == 'dev'
        run: |
          cat > backend-release-manifest.json <<EOF
          {
            "release_sha": "${{ github.sha }}",
            "image": "${{ inputs.image }}",
            "environment": "${{ inputs.environment }}",
            "backend_url": "${{ steps.deploy.outputs.url }}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}"
          }
          EOF
          {
            echo "### Verified backend release"
            echo
            echo "- Release SHA: \`${{ github.sha }}\`"
            echo "- Verified image: \`${{ inputs.image }}\`"
            echo "- Dev backend URL: \`${{ steps.deploy.outputs.url }}\`"
            echo "- Promote to production: run \`Promote Backend\` with \`release_sha=${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified backend release manifest
        if: success() && inputs.environment == 'dev'
        uses: actions/upload-artifact@v6
        with:
          name: backend-release-manifest
          path: backend-release-manifest.json
          retention-days: 14

      - name: Rollback on verification failure
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          echo "Verification failed — rolling back to previous revision"
          REVISIONS=$(gcloud run revisions list \
            --service=${{ vars.CLOUD_RUN_SERVICE }} \
            --region=${{ vars.GCP_REGION }} \
            --format="value(name)" \
            --sort-by="~createTime" \
            --limit=2)
          REVISION_COUNT=$(echo "$REVISIONS" | wc -l | tr -d ' ')
          if [ "$REVISION_COUNT" -ge 2 ]; then
            PREV_REVISION=$(echo "$REVISIONS" | tail -1)
            gcloud run services update-traffic ${{ vars.CLOUD_RUN_SERVICE }} \
              --region=${{ vars.GCP_REGION }} \
              --to-revisions="$PREV_REVISION=100"
            echo "Traffic routed to previous revision: $PREV_REVISION"
          else
            echo "No previous revision found — first deploy, skipping rollback"
          fi

      - name: Cleanup old Cloud Run revisions
        run: |
          REVISIONS=$(gcloud run revisions list \
            --service=${{ vars.CLOUD_RUN_SERVICE }} \
            --region=${{ vars.GCP_REGION }} \
            --format="value(name)" \
            --sort-by="~createTime")
          COUNT=0
          for REV in $REVISIONS; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt 2 ]; then
              echo "Deleting old revision: $REV"
              gcloud run revisions delete "$REV" --region=${{ vars.GCP_REGION }} --quiet || true
            fi
          done

      - name: Cleanup old pre-deploy backups (prod only)
        if: inputs.environment == 'production'
        run: |
          echo "Listing pre-deploy backups..."
          BACKUPS=$(gcloud sql backups list \
            --instance=${{ vars.CLOUD_SQL_INSTANCE_NAME }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --filter="description~'^pre-deploy-'" \
            --sort-by="~startTime" \
            --format="value(id)")
          COUNT=0
          for BACKUP_ID in $BACKUPS; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt 5 ]; then
              echo "Deleting old backup: $BACKUP_ID"
              gcloud sql backups delete "$BACKUP_ID" \
                --instance=${{ vars.CLOUD_SQL_INSTANCE_NAME }} \
                --project=${{ vars.GCP_PROJECT_ID }} --quiet || true
            fi
          done
          echo "Kept $((COUNT < 5 ? COUNT : 5)) backups, deleted $((COUNT > 5 ? COUNT - 5 : 0))"
