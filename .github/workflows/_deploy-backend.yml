# Store ICU - Backend Deploy (Reusable)
# Called by deploy-backend.yml. Builds Docker image, pushes to Artifact Registry,
# deploys to Cloud Run. Wakes Cloud SQL if stopped before running migrations.
#
# Required GitHub Actions variables (set per environment):
#   GCP_PROJECT_ID            – GCP project ID
#   GCP_REGION                – GCP region (asia-southeast2)
#   WORKLOAD_IDENTITY_PROVIDER – Full WIF provider path from terraform output
#   DEPLOY_SERVICE_ACCOUNT    – Deploy SA email from terraform output
#   CLOUD_RUN_SERVICE         – Cloud Run service name (aha-coms-sicu-dev-api / aha-coms-sicu-prod-api)
#   ARTIFACT_REGISTRY_URL     – Docker push URL from terraform output
#   DB_SECRET_NAME            – Secret Manager secret name for database password
#   CLOUD_SQL_INSTANCE_CONNECTION – Cloud SQL instance connection name (project:region:instance)
#   CLOUD_SQL_INSTANCE_NAME   – Cloud SQL instance name (for backups and start/stop API)
#   DB_USER                   – Database username
#   DB_NAME                   – Database name

name: _Deploy Backend

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      CLOUD_SQL_PROXY_VERSION: "2.14.3"

    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - name: Ensure Cloud SQL is running
        run: |
          STATE=$(gcloud sql instances describe ${{ vars.CLOUD_SQL_INSTANCE_NAME }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --format="value(state)")
          echo "Cloud SQL state: $STATE"
          if [ "$STATE" != "RUNNABLE" ]; then
            echo "Starting Cloud SQL instance..."
            gcloud sql instances patch ${{ vars.CLOUD_SQL_INSTANCE_NAME }} \
              --project=${{ vars.GCP_PROJECT_ID }} \
              --activation-policy=ALWAYS --quiet
            echo "Waiting for instance to become RUNNABLE..."
            for i in $(seq 1 30); do
              STATE=$(gcloud sql instances describe ${{ vars.CLOUD_SQL_INSTANCE_NAME }} \
                --project=${{ vars.GCP_PROJECT_ID }} \
                --format="value(state)")
              if [ "$STATE" = "RUNNABLE" ]; then
                echo "Cloud SQL is now RUNNABLE"
                break
              fi
              echo "  Attempt $i/30: state=$STATE, waiting 10s..."
              sleep 10
            done
            if [ "$STATE" != "RUNNABLE" ]; then
              echo "::error::Cloud SQL failed to start after 5 minutes"
              exit 1
            fi
          fi

      - name: Create pre-migration backup (prod only)
        if: inputs.environment == 'production'
        run: |
          BACKUP_DESC="pre-deploy-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}"
          echo "Creating backup: $BACKUP_DESC"
          gcloud sql backups create \
            --instance=${{ vars.CLOUD_SQL_INSTANCE_NAME }} \
            --description="$BACKUP_DESC" \
            --project=${{ vars.GCP_PROJECT_ID }}
          echo "Backup created successfully"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -sSf -o cloud-sql-proxy \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v${CLOUD_SQL_PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy ${{ vars.CLOUD_SQL_INSTANCE_CONNECTION }} --port 5432 &
          sleep 3

      - name: Run database migrations
        run: |
          uv python install 3.14
          cd backend && uv sync --all-extras
          export DB_PASSWORD=$(gcloud secrets versions access latest \
            --secret=${{ vars.DB_SECRET_NAME }} --project=${{ vars.GCP_PROJECT_ID }})
          export DATABASE_URL="postgresql://${{ vars.DB_USER }}:${DB_PASSWORD}@127.0.0.1:5432/${{ vars.DB_NAME }}"
          uv run alembic -c app/db/migrations/alembic.ini upgrade head

      - name: Stop Cloud SQL Auth Proxy
        if: always()
        run: kill $(pgrep -f cloud-sql-proxy) || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ vars.ARTIFACT_REGISTRY_URL }}/${{ vars.CLOUD_RUN_SERVICE }}:${{ github.sha }}
            ${{ vars.ARTIFACT_REGISTRY_URL }}/${{ vars.CLOUD_RUN_SERVICE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract env vars from tfvars
        id: tfvars
        run: |
          TFVARS_ENV="${{ inputs.environment == 'production' && 'prod' || inputs.environment }}"
          TFVARS="infrastructure/terraform/environments/${TFVARS_ENV}.tfvars"
          echo "Reading env vars from $TFVARS"
          echo "PWD=$(pwd)"
          echo "File exists: $(test -f "$TFVARS" && echo yes || echo no)"
          grep gsheets "$TFVARS" || echo "grep found nothing"

          extract() { grep "^$1" "$TFVARS" | cut -d'"' -f2; }

          VP_ID=$(extract gsheets_vp_spreadsheet_id)
          MEETING_ID=$(extract gsheets_meeting_spreadsheet_id)
          EVAL_ID=$(extract gsheets_eval_spreadsheet_id)

          echo "Extracted VP_ID=${VP_ID}"
          echo "Extracted MEETING_ID=${MEETING_ID}"
          echo "Extracted EVAL_ID=${EVAL_ID}"

          {
            echo "GSHEETS_VP_SPREADSHEET_ID=${VP_ID}"
            echo "GSHEETS_MEETING_SPREADSHEET_ID=${MEETING_ID}"
            echo "GSHEETS_EVAL_SPREADSHEET_ID=${EVAL_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.ARTIFACT_REGISTRY_URL }}/${{ vars.CLOUD_RUN_SERVICE }}:${{ github.sha }}
          env_vars: |
            GSHEETS_VP_SPREADSHEET_ID=${{ steps.tfvars.outputs.GSHEETS_VP_SPREADSHEET_ID }}
            GSHEETS_MEETING_SPREADSHEET_ID=${{ steps.tfvars.outputs.GSHEETS_MEETING_SPREADSHEET_ID }}
            GSHEETS_EVAL_SPREADSHEET_ID=${{ steps.tfvars.outputs.GSHEETS_EVAL_SPREADSHEET_ID }}
          flags: ${{ inputs.environment == 'dev' && '--cpu-throttling' || '' }}

      - name: Verify deployment
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.url }}/docs" --max-time 30 || true)
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Health check passed (HTTP $STATUS) at ${{ steps.deploy.outputs.url }}"
          else
            echo "::error::Health check failed (HTTP $STATUS) at ${{ steps.deploy.outputs.url }}/docs"
            exit 1
          fi

      - name: Cleanup old Cloud Run revisions
        run: |
          REVISIONS=$(gcloud run revisions list \
            --service=${{ vars.CLOUD_RUN_SERVICE }} \
            --region=${{ vars.GCP_REGION }} \
            --format="value(name)" \
            --sort-by="~createTime")
          COUNT=0
          for REV in $REVISIONS; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt 2 ]; then
              echo "Deleting old revision: $REV"
              gcloud run revisions delete "$REV" --region=${{ vars.GCP_REGION }} --quiet || true
            fi
          done

      - name: Cleanup old pre-deploy backups (prod only)
        if: inputs.environment == 'production'
        run: |
          echo "Listing pre-deploy backups..."
          BACKUPS=$(gcloud sql backups list \
            --instance=${{ vars.CLOUD_SQL_INSTANCE_NAME }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --filter="description~'^pre-deploy-'" \
            --sort-by="~startTime" \
            --format="value(id)")
          COUNT=0
          for BACKUP_ID in $BACKUPS; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt 5 ]; then
              echo "Deleting old backup: $BACKUP_ID"
              gcloud sql backups delete "$BACKUP_ID" \
                --instance=${{ vars.CLOUD_SQL_INSTANCE_NAME }} \
                --project=${{ vars.GCP_PROJECT_ID }} --quiet || true
            fi
          done
          echo "Kept $((COUNT < 5 ? COUNT : 5)) backups, deleted $((COUNT > 5 ? COUNT - 5 : 0))"
