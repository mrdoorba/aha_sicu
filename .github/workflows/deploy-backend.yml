# Store ICU - Backend Deploy Workflow
# Runs CI first, then calls the reusable deploy workflow.
# Dev: auto-deploys on push to develop.  Prod: requires environment protection approval.

name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'

concurrency:
  group: deploy-backend-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name == 'develop' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    uses: ./.github/workflows/_deploy-backend.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
