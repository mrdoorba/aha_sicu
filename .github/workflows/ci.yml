# Store ICU - CI Workflow
# Runs backend tests + lint and frontend tests + lint + type-check on every PR.
#
# REQUIRED REPOSITORY SETUP:
#   Branch protection rules must be configured on `develop` and `production`:
#     1. Go to Settings → Branches → Add branch protection rule
#     2. Branch name pattern: `develop` (repeat for `production`)
#     3. Enable "Require status checks to pass before merging"
#     4. Add required checks: "Backend Tests & Lint", "Frontend CI"
#     5. Enable "Require branches to be up to date before merging"

name: CI

on:
  pull_request:
    branches: [develop, production]
  workflow_dispatch:
  workflow_call:

jobs:
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_aha_sicu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_aha_sicu
      TESTING: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest -v --cov=app --cov-report=term-missing

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b --noEmit

  frontend-test:
    name: Frontend Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run --shard=${{ matrix.shard }}

  frontend-gate:
    name: Frontend CI
    if: always()
    needs: [frontend-lint, frontend-test]
    runs-on: ubuntu-latest

    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.frontend-lint.result }}" != "success" || "${{ needs.frontend-test.result }}" != "success" ]]; then
            echo "Frontend CI failed"
            exit 1
          fi
