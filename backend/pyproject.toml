[project]
name = "store-icu-backend"
version = "0.1.0"
description = "Store ICU API - Brand health evaluation system"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "firebase-admin>=6.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "google-api-python-client>=2.150.0",
    "google-auth>=2.38.0",
    "psycopg2-binary>=2.9.11",
    "polars>=1.0.0",
    "fastexcel>=0.12.0",
    "python-multipart>=0.0.9",
    "google-cloud-storage>=2.18.0",
    "email-validator>=2.3.0",
    "httpx>=0.27.0",
    "aiosmtplib>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.5.0",
    "httpx>=0.27.0",
    "xlsxwriter>=3.2.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*"]

[tool.coverage.report]
fail_under = 28
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__",
]
